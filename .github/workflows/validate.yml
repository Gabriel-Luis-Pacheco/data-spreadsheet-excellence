name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate skill structure and release consistency
        run: python scripts/validate_skill.py
      - name: Validate harness and agent metadata
        run: python scripts/validate_harness.py
      - name: Enforce core context budgets
        run: python scripts/context_budget.py --check
      - name: Compile utility and test scripts
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Run functional regression tests
        run: python -m unittest discover -s tests -v
