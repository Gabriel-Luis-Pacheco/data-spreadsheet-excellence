name: validate-skill

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate skill structure and release consistency
        run: python scripts/validate_skill.py
      - name: Validate harness and agent metadata
        run: python scripts/validate_harness.py
      - name: Enforce core context budgets
        run: python scripts/context_budget.py --check
      - name: Compile utility and test scripts
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Run functional regression tests
        run: python -m unittest discover -s tests -v
