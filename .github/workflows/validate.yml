name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate skill structure and release consistency
        run: python scripts/validate_skill.py
      - name: Enforce core context budgets
        run: python scripts/context_budget.py --check
      - name: Compile utility and test scripts
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Run functional regression tests
        run: python -m unittest discover -s tests -v
